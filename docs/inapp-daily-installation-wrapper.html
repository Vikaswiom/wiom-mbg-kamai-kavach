<!-- ═══════════════════════════════════════════════════════════════
     CleverTap in-app creative — आज का इंस्टॉलेशन
     Paste this WHOLE file into the CT campaign's custom-HTML in-app.

     Same shape as the shipped docs/inapp-settle-wrapper.html: the
     creative is a thin frame, the screen itself is the Pages page. It
     is split that way for three reasons, all of which matter here:

     1. ORIGIN. In the in-app WebView the creative runs at about:blank,
        so its requests carry Origin: null and TAS cannot allow-list
        them. Inside the iframe the page runs at
        https://vikaswiom.github.io — a real origin TAS CAN allow.
        This is the single biggest reason the API call fails from a
        pasted one-file creative and works from the wrapper.
     2. SHIPPING. The screen is then a normal Pages deploy: push to
        main, live in ~1 min, no CT campaign edit and no re-approval.
     3. BRIDGE. CTWebInterface is reliably injected into the TOP frame
        only. This wrapper owns the bridge and relays for the iframe,
        queueing anything raised before the bridge exists.

     TOKEN SYNTAX — the spans below use the Liquid form with the
     pipe-default filter, which this CT account already substitutes in
     a live creative.

     DO NOT write a Liquid token anywhere else in this file. CleverTap
     parses the WHOLE creative for tokens, HTML comments and script
     bodies included, so a token sitting in a comment is still parsed
     and can refuse to save. The bare pipe-sentinel style in
     particular is a SYNTAX ERROR in this account's editor — confirmed
     on 11 Sep 2026 — so no example of it appears here.

     Liquid is CASE-SENSITIVE: Profile.technicianId and
     Profile.TechnicianId are different properties, and the wrong
     casing yields an empty string rather than an error. Four
     spellings are tried below to cover that. If your account uses
     something else entirely, confirm it in CleverTap under
     Segments > any profile > Custom attributes and add it as another
     span — the id then rides into the page as ?technicianId= and the
     page reports which spelling won as idSource on every event.
     ═══════════════════════════════════════════════════════════════ -->
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#2d1e3e;overflow:hidden}
  #fr{position:fixed;inset:0;width:100%;height:100%;border:0}
  /* z-index maxed and the hit area enlarged: the iframe below is
     full-screen, and a ✕ that is merely painted on top but hard to
     hit reads exactly like a ✕ that does not work. */
  #x{position:fixed;top:8px;right:8px;z-index:2147483647;width:44px;height:44px;border:0;
     border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:19px;line-height:44px;
     text-align:center;padding:0;-webkit-tap-highlight-color:rgba(255,255,255,.3)}
  #dbg{position:fixed;left:0;right:0;bottom:0;z-index:2147483646;max-height:52%;overflow:auto;
     background:#000;color:#0f0;font:11px/1.45 monospace;padding:10px;display:none}
</style>

<span id="tid"  style="display:none">{{ Profile.technicianId | default:"" }}</span>
<span id="tid2" style="display:none">{{ Profile.technician_id | default:"" }}</span>
<span id="eid"  style="display:none">{{ Profile.executorId | default:"" }}</span>
<span id="eid2" style="display:none">{{ Profile.executor_id | default:"" }}</span>

<iframe id="fr" allow="autoplay"></iframe>
<button id="x" onclick="closeIt()" ontouchend="closeIt()" aria-label="Close">&#10005;</button>
<div id="dbg"></div>

<script>
(function(){
  var PAGE = 'https://vikaswiom.github.io/wiom-mbg-kamai-kavach/daily-installation.html';

  function val(id){
    var e = document.getElementById(id), v = (e && e.textContent || '').replace(/^\s+|\s+$/g,'');
    if(v.indexOf('{') > -1) return '';                  /* unresolved token (local test) */
    var l = v.toLowerCase();
    if(l === 'none' || l === 'null' || l === 'undefined' || l === '0') return '';
    return v;
  }

  /* The app may write this profile property under any of these
     spellings, and Liquid is case-sensitive — a single guess is the
     most likely reason a real device opens the popup with no list.
     First one that resolves wins; the rest substitute to '' and cost
     nothing. */
  var id = val('tid') || val('tid2') || val('eid') || val('eid2');
  if(!id){                                              /* browser QA */
    var q = new URLSearchParams(location.search);
    id = (q.get('technicianId') || q.get('executorId') || '').replace(/^\s+|\s+$/g,'');
  }
  var frame = document.getElementById('fr');
  frame.src = PAGE + (id ? ('?technicianId=' + encodeURIComponent(id) +
                            (/[?&]dbg=1/.test(location.search) ? '&dbg=1' : '')) : '');

  /* Tell the page we exist, so it hides its own ✕ and leaves this one
     as the single close button. The page NEVER infers this from being
     framed — CleverTap may frame a creative itself, and a wrong guess
     hides the only ✕ on screen. Repeated because the page may not
     have installed its listener when the first one goes out. */
  function hello(){
    try{
      if(frame.contentWindow){
        frame.contentWindow.postMessage({ __ct:1, action:'wrapperHello', hasCloseButton:true }, '*');
      }
    }catch(e){}
  }
  frame.onload = hello;
  var helloTries = 0;
  (function pingHello(){
    hello();
    if(++helloTries < 8) setTimeout(pingHello, 400);
  })();

  /* ── CT bridge, owned by the top frame ──────────────────────────
     The iframe postMessages here; we forward. Anything raised before
     the bridge is injected is queued, not dropped — the page fires
     DailyInstall_Opened immediately on load and the bridge is not
     always up by then. */
  var q = [], flushing = false;

  function bridgeEvent(ev, props){
    try{
      if(window.CleverTap && typeof window.CleverTap.pushEvent === 'function'){
        props ? window.CleverTap.pushEvent(ev, JSON.stringify(props))
              : window.CleverTap.pushEvent(ev);
        return true;
      }
    }catch(e){}
    try{
      var wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap;
      if(wk){ wk.postMessage({ action:'recordEventWithProps', event:ev, properties:props || {} }); return true; }
    }catch(e){}
    return false;
  }

  /* hardClose() is a global (the ✕ calls it through closeIt), so the
     bridge has to be handed out of this closure or its diagnostic
     event silently never fires. */
  window.__ctBridgeEvent = bridgeEvent;

  function flush(){
    while(q.length){
      if(!bridgeEvent(q[0].event, q[0].properties)) return false;
      q.shift();
    }
    return true;
  }

  function pump(){
    if(flushing) return;
    flushing = true;
    var n = 0;
    (function go(){
      if(flush() || n++ >= 12){ flushing = false; return; }
      setTimeout(go, 250 * Math.min(n, 4));
    })();
  }

  function deepLink(url){
    try{
      if(window.CleverTap && typeof window.CleverTap.openDeepLink === 'function'){
        window.CleverTap.openDeepLink(url); return;
      }
      var wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap;
      if(wk){ wk.postMessage({ action:'openDeepLink', url:url }); return; }
    }catch(e){}
    /* Do NOT add triggerInAppAction — it feature-detects true, then
       silently strands the tap so this branch never runs. */
    window.location.href = url;
  }

  window.addEventListener('message', function(e){
    var d = e && e.data;
    if(!d || d.__ct !== 1) return;
    if(d.action === 'event'){ q.push({ event:d.event, properties:d.properties || {} }); pump(); }
    else if(d.action === 'openDeepLink' && d.url){ deepLink(d.url); }
    else if(d.action === 'dismiss'){ hardClose(); }
  }, false);
})();

/* ── Closing ──────────────────────────────────────────────────────
   Split in two on purpose.

   hardClose() actually closes, and fires EVERY transport without
   returning early: feature-detection is not proof of success, and an
   in-app that is already gone ignores a second dismiss harmlessly,
   whereas a chain that gives up after one silent no-op leaves the
   technician stuck behind a popup that will not close. It ends with
   the clevertap:// URL scheme, which the previous version had no
   equivalent of — if neither bridge answered, nothing happened at all.

   closeIt() is what the ✕ calls: it gives the page a moment to record
   the Dismissed event (only the page knows how many of the day's
   customers were called) and then closes regardless of whether the
   page answers.                                                      */
var closing = false, closed = false;

function probe(fn){ try{ return fn(); }catch(e){ return 'ERR'; } }

/* What this handset actually exposes. Which method name a given
   CTWebInterface version carries is not something that can be checked
   from a laptop, so the ✕ reports it rather than assuming. ?dbg=1
   paints it on screen; it also rides the CT event from the page. */
function dismissCaps(){
  return {
    cleverTap                 : probe(function(){ return !!window.CleverTap; }),
    m_dismissInAppNotification: probe(function(){ return typeof window.CleverTap.dismissInAppNotification; }),
    m_closeInAppNotification  : probe(function(){ return typeof window.CleverTap.closeInAppNotification; }),
    m_dismissInApp            : probe(function(){ return typeof window.CleverTap.dismissInApp; }),
    m_pushEvent               : probe(function(){ return typeof window.CleverTap.pushEvent; }),
    ctKeys                    : probe(function(){ var a=[],k; for(k in window.CleverTap){a.push(k);} return a.join('|'); }),
    webkitCT                  : probe(function(){ return !!(window.webkit && window.webkit.messageHandlers &&
                                                            window.webkit.messageHandlers.clevertap); }),
    webkitKeys                : probe(function(){ var a=[],k; for(k in window.webkit.messageHandlers){a.push(k);} return a.join('|'); })
  };
}

function showDbg(o){
  try{
    var d = document.getElementById('dbg'), h = '<b>wrapper dismiss diagnostics</b><br>', k;
    for(k in o){ if(Object.prototype.hasOwnProperty.call(o,k)){
      h += k + ' = ' + String(o[k]).replace(/</g,'&lt;') + '<br>';
    } }
    d.innerHTML = h; d.style.display = 'block';
  }catch(e){}
}

function hardClose(){
  if(closed) return;
  closed = true;
  var fired = [];

  /* Every method name this SDK might carry — feature-detection is not
     proof of success, and dismissing an in-app that is already gone
     is a harmless no-op. */
  try{ if(window.CleverTap && typeof window.CleverTap.dismissInAppNotification === 'function'){
         window.CleverTap.dismissInAppNotification(); fired.push('dismissInAppNotification'); } }catch(e){}
  try{ if(window.CleverTap && typeof window.CleverTap.closeInAppNotification === 'function'){
         window.CleverTap.closeInAppNotification(); fired.push('closeInAppNotification'); } }catch(e){}
  try{ if(window.CleverTap && typeof window.CleverTap.dismissInApp === 'function'){
         window.CleverTap.dismissInApp(); fired.push('dismissInApp'); } }catch(e){}
  try{
    var wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap;
    if(wk){ wk.postMessage({ action:'dismissInAppNotification' }); fired.push('webkit'); }
  }catch(e){}

  var caps = dismissCaps();
  caps.fired = fired.join(',') || 'NOTHING';
  if(/[?&]dbg=1/.test(location.search)) showDbg(caps);
  /* Record it so a stuck ✕ is diagnosable from the dashboard. */
  try{ if(window.__ctBridgeEvent) window.__ctBridgeEvent('DailyInstall_Dismiss_Attempted_Wrapper', caps); }catch(e){}

  /* Unverified last resort — this scheme appears nowhere but the
     original draft, so it runs ONLY when no bridge existed at all.
     Navigating to an unknown scheme can paint an error page over the
     popup, which is worse than a stuck button. */
  if(!fired.length){
    setTimeout(function(){
      try{ window.location.href = 'clevertap://closeInApp'; }catch(e){}
    }, 700);
  }
}

function closeIt(){
  if(closing) return;
  closing = true;
  try{
    var fr = document.getElementById('fr');
    if(fr && fr.contentWindow){
      fr.contentWindow.postMessage({ __ct:1, action:'requestDismiss' }, '*');
    }
  }catch(e){}
  /* The page answers with action:'dismiss', which hard-closes. If it
     does not answer — it failed to load, or its JS died — close
     anyway. The ✕ must never be a dead button. */
  setTimeout(hardClose, 500);
}
</script>
