<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#2d1e3e;overflow:hidden}
  #fr{position:fixed;inset:0;width:100%;height:100%;border:0}
  #x{position:fixed;top:12px;left:12px;z-index:9;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:17px;line-height:34px;text-align:center;padding:0}
</style>
<span id="cid" style="display:none">{{ Profile.cspid | default:"" }}</span>
<iframe id="fr"></iframe>
<button id="x" onclick="closeIt()">&#10005;</button>
<script>
  (function(){
    var id=(document.getElementById('cid').textContent||'').trim();
    if(id.indexOf('{')>-1)id='';                             /* unresolved token (local test) */
    if(!id){var q=new URLSearchParams(location.search);id=(q.get('cspId')||q.get('cspid')||'').trim();}
    var u='https://vikaswiom.github.io/wiom-mbg-kamai-kavach/netbox-harzana.html'+(id?('?cspId='+encodeURIComponent(id)):'');
    document.getElementById('fr').src=u;
  })();
  function closeIt(){
    try{if(window.CleverTap&&window.CleverTap.dismissInAppNotification){window.CleverTap.dismissInAppNotification();return;}}catch(e){}
    try{window.webkit.messageHandlers.clevertap.postMessage({action:'dismissInAppNotification'});}catch(e){}
  }
  /* The CleverTap JS bridge lives in THIS WebView, not in the iframe —
     the page inside posts its events/close up and we relay them. */
  window.addEventListener('message', function(e){
    var d=e.data||{};
    if(d.t==='close'){closeIt();return;}
    if(d.t==='ct'&&d.ev){
      try{if(window.CleverTap&&window.CleverTap.pushEvent){window.CleverTap.pushEvent(d.ev,JSON.stringify(d.p||{}));return;}}catch(err){}
      try{window.webkit.messageHandlers.clevertap.postMessage({action:'recordEventWithProps',event:d.ev,properties:d.p||{}});}catch(err){}
    }
  });
</script>
